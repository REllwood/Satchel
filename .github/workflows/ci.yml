name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these checks before building installers.
  workflow_call:

# Keyed by the calling workflow too, so the release workflow's test run and a
# normal CI run on the same branch do not cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version is set in package.json, Cargo.toml and tauri.conf.json,
      # and they must agree.
      - name: Check the versions match
        run: |
          pkg=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$pkg" != "$cargo" ] || [ "$pkg" != "$tauri" ]; then
            echo "::error::package.json is $pkg, Cargo.toml is $cargo, tauri.conf.json is $tauri"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04: the ONNX Runtime behind semantic search needs glibc 2.38+.
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      # The Tauri crate expects the frontend output folder to exist.
      - run: mkdir -p dist
        shell: bash
      - run: cargo test --workspace
