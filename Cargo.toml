# Satchel — Cargo workspace
# Three thin shells over one core: the Tauri app (src-tauri), the CLI (crates/satchel-cli),
# and the MCP server (`satchel mcp`, also served by the app binary). All logic lives in satchel-core.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/satchel-core", "crates/satchel-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Satchel"]

# Build dependencies once, share across crates (added incrementally as phases need them).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
satchel-core = { path = "crates/satchel-core" }
