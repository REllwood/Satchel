# MyNote — Cargo workspace
# Three thin shells over one core: the Tauri app (src-tauri), the CLI (crates/mynote-cli),
# and the MCP server (a `mynote mcp` subcommand of the CLI). All logic lives in mynote-core.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/mynote-core", "crates/mynote-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MyNote"]

# Build dependencies once, share across crates (added incrementally as phases need them).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
mynote-core = { path = "crates/mynote-core" }
