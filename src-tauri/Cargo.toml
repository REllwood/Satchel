[package]
name = "satchel-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Satchel desktop app: local-first Markdown notes"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows quirk; see
# https://github.com/rust-lang/cargo/issues/8519).
name = "satchel_app_lib"
# Desktop only: the staticlib and cdylib types are for iOS and Android builds,
# which Satchel does not ship, and would add a large unused library per build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
satchel-core = { workspace = true }
tauri-plugin-dialog = "2.7.1"
trash = "5.2.9"
same-file = "1.0.6"

[dev-dependencies]
tempfile = "3.27.0"

# The mock runtime, to call commands through the real IPC layer in tests. Not
# on Windows: a test binary that builds a Tauri app there needs the
# common-controls manifest that tauri-build embeds only in the app itself, and
# fails to start without it. The IPC contract is the same on every platform.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }
